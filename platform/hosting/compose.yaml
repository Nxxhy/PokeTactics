services:
  server:
    build:
      context: ..
      dockerfile: hosting/Dockerfile
    restart: unless-stopped
    environment:
      POKE_MINIMUM_VERSION: ${POKE_MINIMUM_VERSION:-9.0.0}
    expose: ["8080"]
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set the public DNS name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server]
volumes:
  caddy_data:
  caddy_config:
